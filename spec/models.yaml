# yaml-language-server: $schema=schemas/models.schema.json
#
# ASR model registry: local engines and the hallucination stop-word patterns
# known to leak from
# each model's silence/low-confidence output. See docs/Spec.md.
#
# stop_words are case-insensitive regex fragments (not literal strings):
# `.*` extends a match to swallow trailing hallucinated text, and `\.`
# escapes literal dots (e.g. domain names). They are shared across models
# below because none of these models are known to diverge yet; split a
# model out with its own list as soon as it shows model-specific leakage.

default_model: cohere-transcribe-03-2026

# Decoder-only terminology hints for the small.en speech context, active by
# default (disable per invocation with --speech-context=false). These values
# never rewrite output and never leave the machine.
speech_context:
  prompt_prefix: "Technical dictation. Terms:"
  max_terms: 50
  max_chars: 400
  max_term_chars: 64
  terms:
    - Voxi
    - voxtype
    - dotool
    - PipeWire
    - Wayland
    - systemd
    - Cobra
    - Golang
    - YAML
    - JSON
    - Git

# Last-resort safety circuit breaker before irreversible desktop input. Counts
# are Unicode characters. Repetition requires both thresholds, avoiding normal
# emphatic speech and repeated punctuation.
transcript_safety:
  max_chars: 2000
  max_token_chars: 256
  max_repeat_unit_chars: 16
  min_repeat_count: 12
  min_repeated_chars: 96

models:
  base.en:
    label: "Whisper Base (English)"
    engine: whisper
    stop_words: &common_stop_words
      - { id: thanks-watching, pattern: "thank you for watching" }
      - { id: thanks-for-watching, pattern: "thanks for watching" }
      - { id: thank-you, pattern: "thank you" }
      - { id: thanks-listening, pattern: "thanks for listening" }
      - { id: subscribe, pattern: "please subscribe.*" }
      - { id: subscribe-channel, pattern: "subscribe to my channel" }
      - { id: see-you-next-time, pattern: "see you next time" }
      - { id: see-you-next-video, pattern: "see you in the next video" }
      - { id: subtitles-by, pattern: "subtitles by.*" }
      - { id: subs-byuk, pattern: "subs byuk" }
      - { id: translated-by, pattern: "translated by.*" }
      - { id: like-subscribe, pattern: "like and subscribe" }
      - { id: and-like-thank-you, pattern: "and like\\. thank you" }
      - { id: mcrun, pattern: "mcrun" }
      - { id: mbc, pattern: "mbc" }
      - { id: learn-english, pattern: "learn english.*" }
      - { id: engvid, pattern: ".*engvid\\.com.*" }
      - { id: kathryn, pattern: "kathryn" }
      - { id: in-video, pattern: "in the video" }
      - { id: in-this-video, pattern: "in this video" }
      - { id: in-todays-video, pattern: "in today's video" }
      - { id: if-you-enjoyed-this-video, pattern: "if you enjoyed this video" }
      - { id: free-to-use-tip, pattern: "free-to-use tip" }
      - { id: www-domain, pattern: "www\\.[a-z0-9-]+\\.[a-z]+" }

  small.en:
    label: "Whisper Small (English)"
    engine: whisper
    stop_words: *common_stop_words

  large-v3-turbo:
    label: "Whisper Large v3 Turbo (English/Multilingual)"
    engine: whisper
    stop_words: *common_stop_words
    # CPU RTF 2.54 (0.39x, sub-realtime) vs GPU RTF 0.59 (1.69x) on the
    # T14 Gen2 AMD baseline — see docs/BenchBaseline.md. CPU-only would
    # fall behind live speech in eager mode, so it's disallowed here.
    requires_gpu: true
    # Model to use instead when no GPU render node is present.
    cpu_fallback: small.en

  cohere-transcribe-03-2026:
    label: "Cohere Transcribe 03-2026 (English/Multilingual)"
    engine: cohere-transcribe
    # 066's transcripts on this same fixture corpus showed no model-specific
    # hallucination pattern distinct from the whisper.cpp models (066 §7.4's
    # representative transcript is a fragment/near-miss, not a stock
    # hallucinated phrase) -- reuse common_stop_words per the file header's
    # own guidance ("split a model out ... as soon as it shows model-specific
    # leakage").
    stop_words: *common_stop_words

  openai-transcribe-gemini:
    label: "Gemini (via agy voice RPC, OpenAI-compatible)"
    engine: openai-transcribe
    # The "model" field sent in the request. whisper-server ignores it (one
    # backend, see voxi-clients/agy-voice/whisper-server/server.go, and it
    # is not actually a whisper.cpp model despite the server's name -- see
    # does_llm_cleanup below), but an OpenAI-compatible endpoint may host
    # more than one model and reject a request that omits or misnames it --
    # required by spec validation for this engine regardless.
    api_model: gemini
    # No live-corpus hallucination data yet for this engine (new, issue
    # 126) -- reuse common_stop_words as a safe starting point per the file
    # header's guidance, same as cohere-transcribe-03-2026 above.
    stop_words: *common_stop_words
    # voxi-clients/agy-voice/whisper-server, this engine's current canary
    # target, is backed by agy's Gemini-based voice RPC rather than raw
    # whisper.cpp, so its output already reflects Gemini's own
    # punctuation/formatting pass server-side -- running voxi's own
    # cleanWithLLM on top would be a second, redundant cleanup. Re-check
    # this default once lmcoder:issues/091 lands and becomes the intended
    # target (see issue 126): if lmcoder's endpoint returns raw ASR output
    # instead, flip this to false so voxi's own cleanup still runs for it.
    does_llm_cleanup: true

  r2t2-confucius4:
    label: "R2T2 Confucius4 (lmcoder, local GPU)"
    engine: openai-transcribe
    # Served by lmcoder's asr service behind its proxy (issue 181,
    # lmcoder issue 171); the proxy picks the backend by this model name.
    api_model: r2t2
    # llama-server rejects response_format=text with HTTP 400 ("Only
    # 'json' response_format is supported for transcription") -- verified
    # in issue 134 §6 M1 -- so this backend must send json, unlike the
    # openai-transcribe-gemini/whisper-server entry above.
    response_format: json
    # llama-server's json response leaks a "language <NAME><asr_text>"
    # prefix ahead of the actual transcript (verified in issue 134 §6 M1).
    # <NAME> varies per utterance since R2T2 is multilingual, so this cuts
    # at the literal marker rather than matching a language-specific
    # prefix string.
    strip_before_marker: "<asr_text>"
    # Pinned per model: it cannot share the global openai_asr_base_url
    # with the agy whisper-server entry above (issue 134). This is
    # lmcoder's proxy port.
    base_url: "http://127.0.0.1:8735/v1"
    # lmcoder routes to x600 first and starts the local asr server on
    # demand (lmcoder 173). The wake call at recording start lets a stopped
    # local server load while the user speaks; the proxy holds a request up
    # to 60 s during a cold start, so allow 90 s (issue 181 §7).
    wake_url: "http://127.0.0.1:8735/lmcoder/wake"
    transcribe_timeout_ms: 90000
    # M1 measured this GPU-bound (2.78 GiB VRAM, ~2s for a short clip);
    # no CPU timing was measured and none is expected to be practical.
    requires_gpu: true
    # No live-corpus hallucination data yet for this engine (new, issue
    # 134) -- reuse common_stop_words as a safe starting point, same as
    # the other engines above.
    stop_words: *common_stop_words

  r2t2-confucius4-voxi:
    # Fallback when lmcoder is not installed (issue 181): the same model in
    # voxi's own voxi-r2t2.service (lmcoder's vendored llama-server, files
    # in ~/.cache/voxi/models). Selecting it makes voxi install and start
    # that service; any other model stops it.
    label: "R2T2 Confucius4 (voxi's own llama-server, fallback)"
    engine: openai-transcribe
    # Required by spec validation; the single-model llama-server ignores it.
    api_model: r2t2
    response_format: json
    strip_before_marker: "<asr_text>"
    base_url: "http://127.0.0.1:18131/v1"
    requires_gpu: true
    stop_words: *common_stop_words
