# yaml-language-server: $schema=schemas/models.schema.json
#
# ASR model registry: every Whisper model Voxi is set up to drive through
# voxtype, plus the hallucination stop-word patterns known to leak from
# each model's silence/low-confidence output. See docs/Spec.md.
#
# stop_words are case-insensitive regex fragments (not literal strings):
# `.*` extends a match to swallow trailing hallucinated text, and `\.`
# escapes literal dots (e.g. domain names). They are shared across models
# below because none of these models are known to diverge yet; split a
# model out with its own list as soon as it shows model-specific leakage.

default_model: small.en

# Decoder-only terminology hints for the small.en speech context, active by
# default (disable per invocation with --speech-context=false). These values
# never rewrite output and never leave the machine.
speech_context:
  prompt_prefix: "Technical dictation. Terms:"
  max_terms: 50
  max_chars: 400
  max_term_chars: 64
  terms:
    - Voxi
    - voxtype
    - dotool
    - PipeWire
    - Wayland
    - systemd
    - Cobra
    - Golang
    - YAML
    - JSON
    - Git

models:
  base.en:
    label: "Whisper Base (English)"
    engine: whisper
    stop_words: &common_stop_words
      - { id: thanks-watching, pattern: "thank you for watching" }
      - { id: thanks-for-watching, pattern: "thanks for watching" }
      - { id: thank-you, pattern: "thank you" }
      - { id: thanks-listening, pattern: "thanks for listening" }
      - { id: subscribe, pattern: "please subscribe.*" }
      - { id: subscribe-channel, pattern: "subscribe to my channel" }
      - { id: see-you-next-time, pattern: "see you next time" }
      - { id: see-you-next-video, pattern: "see you in the next video" }
      - { id: subtitles-by, pattern: "subtitles by.*" }
      - { id: subs-byuk, pattern: "subs byuk" }
      - { id: translated-by, pattern: "translated by.*" }
      - { id: like-subscribe, pattern: "like and subscribe" }
      - { id: and-like-thank-you, pattern: "and like\\. thank you" }
      - { id: mcrun, pattern: "mcrun" }
      - { id: mbc, pattern: "mbc" }
      - { id: learn-english, pattern: "learn english.*" }
      - { id: engvid, pattern: ".*engvid\\.com.*" }
      - { id: kathryn, pattern: "kathryn" }
      - { id: in-video, pattern: "in the video" }
      - { id: in-this-video, pattern: "in this video" }
      - { id: in-todays-video, pattern: "in today's video" }
      - { id: if-you-enjoyed-this-video, pattern: "if you enjoyed this video" }
      - { id: free-to-use-tip, pattern: "free-to-use tip" }
      - { id: www-domain, pattern: "www\\.[a-z0-9-]+\\.[a-z]+" }

  small.en:
    label: "Whisper Small (English)"
    engine: whisper
    stop_words: *common_stop_words

  large-v3-turbo:
    label: "Whisper Large v3 Turbo (English/Multilingual)"
    engine: whisper
    stop_words: *common_stop_words
    # CPU RTF 2.54 (0.39x, sub-realtime) vs GPU RTF 0.59 (1.69x) on the
    # T14 Gen2 AMD baseline — see docs/BenchBaseline.md. CPU-only would
    # fall behind live speech in eager mode, so it's disallowed here.
    requires_gpu: true
    # Model to use instead when no GPU render node is present.
    cpu_fallback: small.en
