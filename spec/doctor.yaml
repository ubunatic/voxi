# yaml-language-server: $schema=schemas/doctor.schema.json
checks:
  - id: services
    title: audio services
    order: 1
    repair_order: 1
    services:
      - {scope: user, unit: pipewire.service}
      - {scope: user, unit: pipewire-pulse.service}
      - {scope: user, unit: wireplumber.service}
      - {scope: system, unit: bluetooth.service}
    repair:
      prompt: Restart the failed service or inspect its journal.
      settle_graph: true
      templates:
        restart_user: "systemctl --user restart {{unit}}"
        restart_system: "sudo systemctl restart {{unit}}"
        journal_user: "journalctl --user -u {{unit}} -b"
        journal_system: "journalctl -u {{unit}} -b"
  - id: default-devices
    title: default devices
    order: 2
    repair_order: 3
    defaults:
      - {kind: sink, class: Audio/Sink}
      - {kind: source, class: Audio/Source}
    repair:
      prompt: Restore the active default or select an available configured device.
      templates:
        active: "pw-metadata 0 default.audio.{{kind}} '{\"name\":\"{{node.name}}\"}' Spa:String:JSON"
        active_missing: "wpctl status"
        configured: "wpctl set-default {{node.id}}"
        configured_missing: "wpctl status"
  - id: bt-card-profile-off
    title: Bluetooth card profile
    order: 3
    repair_order: 2
    bluetooth:
      api: bluez5
      off_profile: off
    repair:
      prompt: Switch the Bluetooth card to its first available profile.
      templates:
        profile: "pactl set-card-profile {{card.name}} {{profile.name}}"
  - id: journal-signals
    title: audio journal signals
    order: 4
    severity: evidence
    journal:
      signals:
        - profiles inconsistent
        - Unable to get default sink
        - timeout on stream
        - Host is down
        - profile connect failed
        - Mic problem
        - card removed
      resume_marker: System returned from sleep operation
      suspend_marker: Performing sleep operation
    repair:
      prompt: Review the audio journal evidence.
      templates: {see: "journalctl --user -b"}
  - id: coredumps
    title: audio process crashes
    order: 5
    severity: evidence
    coredumps:
      since: -7 days
      processes: [pipewire, pipewire-pulse, wireplumber, gnome-control-center, voxi]
    repair:
      prompt: Inspect the latest core dump stack trace.
      templates:
        see: "coredumpctl info {{exe}}  # inspect the stack trace, then check services for crash loops"
  - id: mic
    title: microphone source
    order: 6
    repair_order: 4
    repair:
      prompt: Apply the existing mic doctor repair plan.
      templates: {see: "voxi mic"}
  - id: stream-routing
    title: playback stream routing
    order: 7
    repair_order: 5
    routing:
      probe_node: voxi-doctor-probe
      script: routing-probe.sh
      sample_rate: 48000
      channels: 1
      duration_ms: 1000
      dummy_sink_names: [auto_null]
      dummy_sink_factories: [support.null-audio-sink]
    repair:
      prompt: Restart WirePlumber after confirming earlier device faults are fixed.
      settle_graph: true
      templates:
        restart: "systemctl --user restart wireplumber"
  - id: asr-engine
    title: ASR transcription engine
    order: 8
    repair_order: 6
    repair:
      prompt: Restart the lmcoder proxy. The local fallback is never offered here; it is not checked for model files.
      templates:
        restart_proxy: "systemctl --user restart lmcoder-proxy.service"
scripts:
  routing-probe.sh: scripts/routing-probe.sh
settle:
  timeout_ms: 5000
  interval_ms: 100
snapshots:
  keep_count: 5
  max_age_days: 14
