# yaml-language-server: $schema=schemas/tts.schema.json
#
# Playback tuning for monitor-gated `voxi say`. These settings are embedded
# in the Voxi binary; edit the spec and rebuild to change them.
backend:
  # Select Piper when a model is configured, otherwise use the legacy chain.
  default_backend: auto
piper:
  # Installed by `voxi install`; user configuration can override these paths.
  model: "~/.local/share/voxi/voices/en_US-lessac-medium.onnx"
  config: "~/.local/share/voxi/voices/en_US-lessac-medium.onnx.json"
playback:
  # Trim at most this much quiet audio from the end of each synthesized chunk.
  # This shortens pauses between chunks without cutting audible speech. Set to
  # zero to disable trimming.
  trailing_silence_trim_ms: 250
  # A sample is considered quiet below this full-scale amplitude level.
  trailing_silence_threshold_db: -42

# Cloned-voice synthesis via a separately installed tts-serve HTTP server
# (issue 155 M1, API in issue 157). Opt-in only: "auto" never selects this
# backend even when it is reachable; set backend.default_backend or
# VOXI_TTS_BACKEND to "tts-serve" explicitly.
tts_serve:
  # Local tts-serve endpoint; voxi does not install or launch the server.
  url: "http://127.0.0.1:8000"
  # Chatterbox on CPU costs about 10s of compute per 1s of audio. Text is sent
  # sentence-chunked (see internal/tts.SplitText) and, for this backend only,
  # re-split at max_chunk_runes (see below), so each request only needs to
  # cover one capped chunk's audio. At an assumed ~150 words/min speaking rate
  # (~6 runes/word, so ~15 runes/s of audio), max_chunk_runes: 120 is about 8s
  # of audio, i.e. ~80s of compute (120 / 15 * 10). 150000 leaves ~1.9x margin
  # over that (issue 155 M3 pre-work).
  timeout_ms: 150000
  # For the tts-serve backend only: sentences longer than this are re-split at
  # clause (,;:) then word boundaries before being sent, so no single request
  # risks exceeding timeout_ms. Piper's chunking (internal/tts.SplitText) is
  # unaffected.
  max_chunk_runes: 120
  # Default reference WAV; stays empty here. `voxi voice clone` (issue 155 M2)
  # writes the resolved voice profile to tts_serve_reference_wav in
  # ~/.config/voxi/config.yaml (or set VOXI_TTS_SERVE_REFERENCE_WAV) instead of
  # rebuilding, because the wrapped engine requires a non-empty reference clip.
  reference_wav: ""
  # Each tts-serve instance wraps one engine; "chatterbox" is descriptive only
  # (used in error messages) and is not sent in the request.
  engine: "chatterbox"
  # Merged as flat top-level request fields (e.g. seed, exaggeration,
  # cfg_weight) -- the wrapped engine's schema has no nested "settings" object
  # and rejects unknown top-level keys (issue 155 M2 pre-work).
  settings: {}

# Speech-ready narration through lmcoder.
llm:
  # Used when ~/.config/voxi/config.yaml and --llm do not select a host.
  default_host: localhost
  max_tokens: 4096
