# yaml-language-server: $schema=schemas/tts.schema.json
#
# Playback tuning for monitor-gated `voxi say`. These settings are embedded
# in the Voxi binary; edit the spec and rebuild to change them.
backend:
  # Select Piper when a model is configured, otherwise use the legacy chain.
  default_backend: auto
piper:
  # Installed by `voxi install`; user configuration can override these paths.
  model: "~/.local/share/voxi/voices/en_US-lessac-medium.onnx"
  config: "~/.local/share/voxi/voices/en_US-lessac-medium.onnx.json"
voxcpm:
  runtime_version: v0.8.2-audio8-perf-hotfix
  source_commit: ac16661d144f00f84ea0483f3574c374c9868e2d
  runtime_assets:
    - url: "https://github.com/0xShug0/audio.cpp/releases/download/v0.8.2-audio8-perf-hotfix/audio-v0.8.2-audio8-perf-hotfix-bin-ubuntu-x64-vulkan.tar.gz"
      sha256: "2144c8565f9b963dcea7a42cdc1bd09b09149f5934c0332f7383ed51a6b4418c"
    - url: "https://github.com/0xShug0/audio.cpp/releases/download/v0.8.2-audio8-perf-hotfix/audio-v0.8.2-audio8-perf-hotfix-bin-ubuntu-x64-vulkan-portable.tar.gz"
      sha256: "0763c8a828be4d428884878d0de6b551ed269a3695fe78537e8f68de9067c98c"
  binary: "~/.local/share/voxi/voxcpm/bin/audiocpp_cli"
  model: "~/.local/share/voxi/voxcpm/model/voxcpm-0.5b-q8_0-audiovae-f16.gguf"
  model_revision: "5f57aad57dc0acea2e6a571ec99c71e4035f812d"
  model_url: "https://huggingface.co/audio-cpp/audio.cpp-gguf/resolve/5f57aad57dc0acea2e6a571ec99c71e4035f812d/VoxCPM1-GGUF/voxcpm-0.5b-q8_0-audiovae-f16.gguf"
  model_sha256: "01210319c5ce617613c9d1c38e34649f7479e98a60d51b719f7df82970658241"
  backend: vulkan
  family: voxcpm1
  threads: 12
  seed: 42
  num_inference_steps: 10
  guidance_scale: 2.0
  default_preset: full
  max_text_chars: 1000
  presets:
    full:
      reference_wav: "~/.local/share/voxi/voxcpm/voices/full.wav"
      reference_text: "Good morning. Today I want to read a short passage at a relaxed pace. I speak clearly, take a breath between sentences and let each word finish before the next one starts. This is how I would like my voice to sound."
      session_options:
        - voxcpm1.audiovae_encoder_sample_capacity=320000
    short:
      reference_wav: "~/.local/share/voxi/voxcpm/voices/short.wav"
      reference_text: "I speak clearly, take a breath between sentences and let each word finish before the next one starts."
      reference_start_sample: 109386
      reference_end_sample: 248091
      session_options: []
playback:
  # Trim at most this much quiet audio from the end of each synthesized chunk.
  # This shortens pauses between chunks without cutting audible speech. Set to
  # zero to disable trimming.
  trailing_silence_trim_ms: 250
  # A sample is considered quiet below this full-scale amplitude level.
  trailing_silence_threshold_db: -42

# Speech-ready narration through lmcoder.
llm:
  # Used when ~/.config/voxi/config.yaml and --llm do not select a host.
  default_host: localhost
  max_tokens: 4096
