# yaml-language-server: $schema=schemas/eager.schema.json
#
# Eager pipeline injection-safety tuning. See docs/Spec.md — internal/eager
# must read these values from here rather than hardcoding them.

# Modifier-release race guard (issue 101): while a gating modifier (Super,
# etc.) is held, eager output is buffered instead of typed immediately, since
# the physical key-release that ends modifier-gating can simultaneously
# trigger unrelated WM/DE behavior (e.g. GNOME's Activities overview on a
# bare Super release) that steals focus before the buffered text lands.
energy_gate:
  threshold_rms: 150
  min_mean_rms: 120
  min_voiced_frames: 8
  min_voiced_run_frames: 7

modifier_gate:
  # Staleness window: only buffer/pause when the most recent gating-modifier
  # press is within this many milliseconds of a chunk becoming ready to
  # type. A modifier press older than this (e.g. unrelated hotkey use
  # earlier in the same session) is treated as stale and typing proceeds
  # normally -- blocking indefinitely on a stale press would silently drop
  # output, the same class of regression issue 083 section 8 fixed once already.
  timeout_ms: 10000
  # Start grace: modifier presses observed within this many milliseconds of
  # a recording session starting are ignored for staleness purposes. The
  # recording-start hotkey itself (e.g. Super+X) is a gating-modifier press
  # -- without this, the very press that starts the session would look
  # "recent" to the first chunk and wrongly enter buffering every time
  # (confirmed live: starting a recording immediately triggered "Typing
  # paused" on the first chunk with no other modifier ever touched).
  start_grace_ms: 750
  # Notify delay: how long to wait before actually playing the "Typing
  # paused" clip after entering buffering. If the session's flush trigger
  # (Stop, e.g. pressing Super+X right after the last chunk) fires before
  # this delay elapses, the notification is canceled and never played --
  # buffering itself still correctly held the text and the flush still
  # correctly types it, but there is nothing left for the user to be told
  # to do (confirmed live: speaking a sentence and immediately pressing
  # Super+X lost nothing, yet still played "Typing paused" pointlessly
  # after the session had already closed and flushed).
  notify_delay_ms: 500

# Post-stop delivery drain (issue 115). A session's capture stops immediately
# on Stop, while ASR, LLM cleanup, and keystroke injection for already-captured
# speech continue in the background. The policy question is "may this
# generation still type?" -- and the real answer is "yes, unless a newer
# session has started", not "yes, for N seconds". The previous five-second
# wall-clock lease was only a proxy for that and silently dropped fully
# transcribed, accepted speech whenever queue backlog or LLM cleanup pushed the
# last chunk past it (confirmed live twice: chunks #563/#564 and #1120).
drain:
  # Absolute safety net, not the delivery policy: it only stops an abandoned
  # generation from typing minutes later when the user never starts another
  # session. Sized well above the longest transcription timeout (90 s for a
  # model whose server may cold-start, spec/models.yaml) plus injection, so
  # it is never the reason a real utterance is dropped.
  delivery_deadline_ms: 150000
  # Per-delivery injection budget, on a context independent of the drain:
  # once keystrokes start, aborting mid-word is strictly worse than finishing.
  # Must exceed the 5s physical-modifier-release wait inside
  # typing.TypeTextObserved, which spends the same context.
  injection_timeout_ms: 15000

# Mic self-check (issue 177). Recording starts at once on the current default
# mic; this check runs alongside it. If PipeWire has no usable mic, or the first
# audio is digital silence, voxi repairs the setup (internal/mic), stops the
# broken recording and asks the user to record again.
mic_check:
  # Budget for the whole check-and-repair run (pw-dump + wpctl calls).
  timeout_ms: 5000
  # Window for judging the audio itself, at any point in the recording: the mic
  # is dead if under a quarter of the expected audio arrived (a stalled
  # Bluetooth transport), or, for a built-in mic, if every sample was exactly
  # zero. Bluetooth headsets emit zeros for 1-3s while switching to headset
  # mode (measured live), so zeros never count for them.
  dead_signal_ms: 3000
  # How long to wait for WirePlumber to apply a profile or default change.
  settle_ms: 1500

# Bluetooth headset dictation (issue 210). When the default source is a
# Bluetooth input, voxi scales its captured PCM by gain_factor before the gate
# and ASR; the system volume is never touched. The keep-awake drop-in and the
# autoswitch setting are written only by the explicit `voxi mic headset`
# command, which uses these names and the marker to find and undo its own file.
bluetooth_mic:
  # PipeWire identity of a Bluetooth node: the card's device.api, or a node name
  # starting with node_prefix. Detection (internal/mic) reads both.
  device_api: bluez5
  node_prefix: bluez_
  # Linear sample gain for Bluetooth default sources. Derived from the
  # 2026-11-02 host measurement (see the issue 210 Decision and docs/AudioDoctor.md).
  gain_factor: 2.75
  # Ceiling for the user override bluetooth_mic_gain in config.yaml. The schema's
  # gain_factor maximum must equal it (spec/bluetooth_mic_test.go checks this).
  gain_max: 16
  # WirePlumber node-name matches the keep-awake drop-in applies to.
  node_matches: ["~bluez_input.*", "~bluez_capture_internal.*"]
  # Idle suspend timeout for those nodes; 0 keeps the mic link awake.
  suspend_timeout_seconds: 0
  # WirePlumber setting that switches a headset to HFP when a stream opens.
  autoswitch_setting: bluetooth.autoswitch-to-headset-profile
  # Drop-in file name under the WirePlumber config directory.
  dropin_name: 51-voxi-bt-mic-no-suspend.conf
  # First line of the drop-in; a file carrying it is voxi's to rewrite or remove.
  dropin_marker: "# managed-by: voxi mic headset"
  # Card profiles: voxi pins a Bluetooth card on a2dp_profile to headset_profile
  # when it enables keep-awake, because autoswitch is off and nothing else would.
  a2dp_profile: a2dp-sink
  headset_profile: headset-head-unit
  # Line voxi writes into its drop-in when it turned autoswitch off (prefix + "true");
  # `--off` restores autoswitch only when this line is present.
  restore_record_prefix: "# voxi-restore-autoswitch: "
